[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ifc-agent-poc"
version = "0.1.0"
description = "Agentic IFC correction PoC — LLM tool-use over IfcOpenShell for digital-twin-ready IFC"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# Agent-layer dependencies only. The web GUI / 3D viewer stack
# (fastapi, uvicorn, jinja2, python-multipart) is intentionally excluded from
# this PoC bundle.
dependencies = [
    "ifcopenshell>=0.8.0",   # IFC parsing + mutation (the tool backend)
    "ifctester>=0.8.0",      # IDS validation
    "bsdd>=0.1.0",           # buildingSMART Data Dictionary client
    "fastmcp>=2.0.0",        # MCP server exposing the IFC tools
    "openai>=1.13.0",        # OpenAI-compatible client (Groq/OpenRouter/Anthropic)
    "pyyaml>=6.0",           # BEP rule packs
    "pymupdf>=1.24.0",       # PDF ingestion (BEP)
    "python-docx>=1.1.0",    # DOCX ingestion (BEP)
    "click>=8.1.0",          # CLI
    "rich>=13.0.0",          # CLI output
    "python-dotenv>=1.0.0",  # .env loading
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
ifc-agent = "ifc_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
